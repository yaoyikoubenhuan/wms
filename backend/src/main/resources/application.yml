server:
  port: 8080

spring:
  application:
    name: work-management-system-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/wms_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  jackson:
    # 日期时间序列化为 ISO 字符串（LocalDate -> yyyy-MM-dd，LocalDateTime -> yyyy-MM-ddTHH:mm:ss）
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_uuid

logging:
  level:
    com.wms: debug
